[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treeco"
version = "0.1.0"
description = "Tree size and carbon estimation from CommuniMap citizen-science imagery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Federico Stachurski" }
]
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "matplotlib",
    "scikit-learn",
    "torch",
    "torchvision",
    "tqdm",
    "rasterio",
    "pyproj"
]

[project.scripts]
treeco-build-manifest = "treeco.data.build_manifest:main"
treeco-estimate-carbon = "treeco.carbon.estimate_carbon:main"
treeco-predict = "treeco.inference.predict:main"

treeco-download-models = "treeco.image_models.download_cli:main"
treeco-build-dataset = "treeco.pipeline.build_dataset_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["treeco*"]
